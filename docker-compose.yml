services:

  api:
    build: .
    container_name: finsight-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - postgres
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: finsight-postgres
    environment:
      POSTGRES_DB: finsight
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - finsight_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  finsight_postgres_data: